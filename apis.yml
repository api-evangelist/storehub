aid: storehub
name: StoreHub
description: >-
  StoreHub is Southeast Asia's leading all-in-one cloud-based point-of-sale (POS)
  and business-management platform. Founded in 2013 and headquartered in Malaysia,
  it powers over 18,000 restaurants, retailers, and service-based businesses across
  Malaysia, the Philippines, and Thailand. The platform bundles POS, inventory
  management, multi-location management, employee management, reporting and
  analytics, QR Order & Pay, e-invoicing (LHDN/BIR compliant), loyalty and
  cashback, SMS marketing (Engage), Beep Delivery online ordering, a branded
  webstore, and marketplace and food-delivery integrations. StoreHub exposes a
  private, partner-gated REST API for custom integrations (dedicated API access is
  an Enterprise-tier feature); credentials are issued by Customer Care on request
  and there is no public OpenAPI specification or self-serve developer portal.
